services:
  db:
    image: postgres:16
    restart: always
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - forge-postgres16-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local

volumes:
  forge-postgres16-data:

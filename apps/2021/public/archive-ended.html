<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knight Hacks 2021 - Event ended</title>
    <style>
      @font-face {
        font-family: "Sansita";
        src: url("/assets/fonts/Sansita-BlackItalic.ttf") format("truetype");
      }
      @font-face {
        font-family: "Palanquin";
        src: url("/assets/fonts/Palanquin-Regular.ttf") format("truetype");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: #fff;
        font-family: "Palanquin", sans-serif;
        background: #07366e;
      }
      main {
        width: min(38rem, 100%);
        padding: clamp(1.5rem, 6vw, 3rem);
        border-radius: 1rem;
        text-align: center;
        background: rgb(73 119 164 / 78%);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 30%);
      }
      img {
        display: block;
        width: min(28rem, 100%);
        margin: 0 auto 2rem;
      }
      h1 {
        margin: 0;
        font-family: "Sansita", sans-serif;
        font-size: clamp(2.25rem, 9vw, 4rem);
        line-height: 1;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.55;
      }
      a {
        color: #fff;
        font-weight: 700;
      }
      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/knight-hacks-white.png" alt="Knight Hacks" />
      <h1>This event has ended.</h1>
      <p>
        Registration and application pages for Knight Hacks 2021 are closed.
        This archive preserves the public event site only.
      </p>
      <p>
        <a href="https://2026.knighthacks.org/"
          >Visit the current Knight Hacks event</a
        >
      </p>
      <p><a href="/">Return to the 2021 archive</a></p>
    </main>
  </body>
</html>

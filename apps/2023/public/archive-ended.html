<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knight Hacks 2023 - Event ended</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #1d1234;
        font-family: system-ui, sans-serif;
        background: #37388f url("/assets/background.png") center/cover no-repeat;
      }
      main {
        width: min(36rem, 100%);
        padding: 2rem;
        border-radius: 1.25rem;
        background: rgb(255 255 255 / 94%);
        box-shadow: 0 1.5rem 4rem rgb(20 12 42 / 35%);
      }
      img {
        display: block;
        width: min(20rem, 100%);
        margin: 0 auto 2rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
      }
      a {
        color: #4c3984;
        font-weight: 800;
      }
      a:focus-visible {
        outline: 3px solid #766dc8;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo.png" alt="Knight Hacks 2023" />
      <h1>This event has ended.</h1>
      <p>
        Applications and hacker accounts for Knight Hacks 2023 are closed. This
        site now preserves the public event experience only.
      </p>
      <p>
        <a href="https://2026.knighthacks.org/">Visit the current event</a>
      </p>
      <p><a href="/">Return to the 2023 archive</a></p>
    </main>
  </body>
</html>
